<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #1e1b4b, #4c1d95);
    color: #f5f3ff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 560px;
    text-align: center;
  }
  h1 {
    font-size: clamp(2rem, 5vw, 3.25rem);
    line-height: 1.1;
    margin-bottom: 16px;
  }
  p {
    font-size: 1.1rem;
    color: #ddd6fe;
    margin-bottom: 32px;
  }
  .cta {
    display: inline-block;
    background: #f5f3ff;
    color: #1e1b4b;
    text-decoration: none;
    font-weight: 600;
    padding: 14px 32px;
    border-radius: 999px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .cta:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
  }
  footer {
    margin-top: 48px;
    font-size: 0.85rem;
    color: #a78bfa;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Build something great.</h1>
    <p>A clean starting point for your next idea — fast, simple, and ready to customize.</p>
    <a class="cta" href="getstarted.html">Get Started</a>
    <footer>&copy; 2026 Your Company</footer>
  </div>
</body>
</html>
